[package]
name = "rlogs-desktop-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rlogs-capture = { path = "../../engine/capture" }
rlogs-core = { path = "../../engine/core" }
rlogs-events = { path = "../../engine/events" }
rlogs-game-bpsr = { path = "../../plugins/games/blue-protocol-star-resonance" }
rlogs-log-format = { path = "../../engine/log-format" }
rlogs-network = { path = "../../engine/network" }
rlogs-plugin-combat-meter = { path = "../../plugins/builtin/combat-meter" }
rlogs-plugin-runtime = { path = "../../engine/plugin-runtime" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
bytes.workspace = true
etherparse.workspace = true
