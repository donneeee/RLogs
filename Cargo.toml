[workspace]
members = [
    "apps/plugin-lab",
    "engine/capture",
    "engine/core",
    "engine/events",
    "engine/game-data",
    "engine/game-plugin-api",
    "engine/network",
    "engine/plugin-api",
    "engine/plugin-host",
    "engine/submission",
    "plugins/games/blue-protocol-star-resonance",
    "tools/capture-inspect",
    "tools/game-data-build",
    "tools/plugin-inspect",
    "tools/process-capture",
    "tools/reference-reconcile",
    "plugins/games/blue-protocol-star-resonance/tools/profile-audit",
    "plugins/games/blue-protocol-star-resonance/tools/protocol-journal",
    "plugins/games/blue-protocol-star-resonance/tools/protocol-coverage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
etherparse = "0.21.0"
pcap-parser = "0.17.0"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
walkdir = "2"
windows-sys = "0.61"
zstd = { version = "0.13.3", default-features = false }
