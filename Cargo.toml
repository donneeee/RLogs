[workspace]
members = [
    "engine/capture",
    "engine/events",
    "engine/network",
    "engine/plugin-api",
    "engine/protocol",
    "engine/submission",
    "tools/capture-inspect",
    "tools/protocol-coverage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
etherparse = "0.21.0"
pcap-parser = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zstd = { version = "0.13.3", default-features = false }
