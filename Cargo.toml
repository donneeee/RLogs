[workspace]
members = [
    "apps/desktop",
    "apps/desktop-tauri",
    "apps/plugin-lab",
    "engine/capture",
    "engine/combat",
    "engine/core",
    "engine/events",
    "engine/game-data",
    "engine/game-plugin-api",
    "engine/log-format",
    "engine/network",
    "engine/plugin-api",
    "engine/plugin-host",
    "engine/plugin-runtime",
    "engine/profiles",
    "engine/submission",
    "plugins/builtin/combat-meter",
    "plugins/builtin/encounter-recorder",
    "plugins/games/blue-protocol-star-resonance",
    "plugins/games/blue-protocol-star-resonance/features/module-optimizer",
    "plugins/games/blue-protocol-star-resonance/features/module-optimizer/wasm",
    "tools/capture-inspect",
    "tools/game-data-build",
    "tools/plugin-inspect",
    "tools/process-capture",
    "tools/reference-reconcile",
    "tools/rlog-build",
    "plugins/games/blue-protocol-star-resonance/tools/profile-audit",
    "plugins/games/blue-protocol-star-resonance/tools/factor-capture-audit",
    "plugins/games/blue-protocol-star-resonance/tools/offline-recorder",
    "plugins/games/blue-protocol-star-resonance/tools/protocol-journal",
    "plugins/games/blue-protocol-star-resonance/tools/protocol-coverage",
    "services/submissions",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
aes = "0.8.4"
axum = "0.8.9"
bytes = { version = "1.12.1", features = ["serde"] }
cbc = "0.1.2"
etherparse = "0.21.0"
hmac = "0.12.1"
num-bigint = "0.4"
num-integer = "0.1"
pcap-parser = "0.17.0"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2"
windows-sys = "0.61"
zstd = { version = "0.13.3", default-features = false }

# Plugin Lab is a development binary, but full profile optimization is a
# compute-heavy hot path. Keep this isolated crate optimized in dev builds so
# testing the website does not turn a 649-module search into a minute-long wait.
[profile.dev.package.rlogs-bpsr-module-optimizer]
opt-level = 3

# Live-capture testing runs the real post-processing pipeline. Optimize its
# data-heavy crates in development builds so stopping a capture does not spend
# minutes parsing and hashing large canonical JSONL logs.
[profile.dev.package.rlogs-game-bpsr]
opt-level = 3

[profile.dev.package.rlogs-log-format]
opt-level = 3

[profile.dev.package.rlogs-plugin-runtime]
opt-level = 3

[profile.dev.package.rlogs-plugin-combat-meter]
opt-level = 3

[profile.dev.package.rlogs-plugin-encounter-recorder]
opt-level = 3

[profile.dev.package.rlogs-submission]
opt-level = 3

# Serde JSON, SHA-256, and other third-party hot paths dominate large-log
# finalization. Keep workspace crates debuggable while optimizing dependencies.
[profile.dev.package."*"]
opt-level = 2
