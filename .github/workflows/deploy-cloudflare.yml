name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "plugins/games/blue-protocol-star-resonance/game-data/**"
      - "protocol-packs/**"
      - "services/submissions/cloudflare-backend/**"
      - "services/submissions/cloudflare-gateway/**"
      - "services/submissions/cloudflare-verifier/**"
      - "services/submissions/Dockerfile.hosted-verifier"
      - "tools/smoke-test-cloudflare-production.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            services/submissions/cloudflare-backend/package-lock.json
            services/submissions/cloudflare-gateway/package-lock.json
            services/submissions/cloudflare-verifier/package-lock.json

      - name: Require the production Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }

      - name: Install the hosted verifier deployment tools
        working-directory: services/submissions/cloudflare-verifier
        run: npm ci --ignore-scripts

      - name: Test the stateful backend and migrate production metadata
        working-directory: services/submissions/cloudflare-backend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run db:migrate:remote

      - name: Test and deploy the private replay verifier
        working-directory: services/submissions/cloudflare-verifier
        run: |
          npm test
          npx wrangler deploy --var "VERIFIER_RELEASE:${{ github.sha }}"

      - name: Deploy the stateful backend
        working-directory: services/submissions/cloudflare-backend
        run: |
          npx wrangler deploy --var "BACKEND_RELEASE:${{ github.sha }}"

      - name: Test and deploy the public Pages gateway
        working-directory: services/submissions/cloudflare-gateway
        run: |
          npm ci --ignore-scripts
          npm test
          npx wrangler pages deploy public \
            --project-name rlogs-submissions \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-message "Deploy rLogs Cloudflare production ${{ github.sha }}"

      - name: Verify the public service and deployed revision
        run: node tools/smoke-test-cloudflare-production.mjs https://rlogs-submissions.pages.dev "${{ github.sha }}"
