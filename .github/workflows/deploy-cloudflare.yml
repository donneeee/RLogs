name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "plugins/games/blue-protocol-star-resonance/game-data/**"
      - "protocol-packs/**"
      - "services/submissions/cloudflare-backend/**"
      - "services/submissions/cloudflare-gateway/**"
      - "services/submissions/cloudflare-verifier/**"
      - "services/submissions/Dockerfile.hosted-verifier"
      - "tools/smoke-test-cloudflare-production.mjs"
  workflow_dispatch:
    inputs:
      projection_backfill:
        description: "Schema 12 projection backfill action"
        required: true
        type: choice
        default: none
        options:
          - none
          - dry-run
          - publish
      projection_backfill_limit:
        description: "Maximum public reports to inspect (1-25)"
        required: true
        default: "10"
      projection_backfill_after_report_id:
        description: "Optional exclusive rpt_ cursor"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            services/submissions/cloudflare-backend/package-lock.json
            services/submissions/cloudflare-gateway/package-lock.json
            services/submissions/cloudflare-verifier/package-lock.json

      - name: Require the production Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret" >&2; exit 1; }

      - name: Install the hosted verifier deployment tools
        working-directory: services/submissions/cloudflare-verifier
        run: npm ci --ignore-scripts

      - name: Test the stateful backend and migrate production metadata
        working-directory: services/submissions/cloudflare-backend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run db:migrate:remote

      - name: Test and deploy the private replay verifier
        working-directory: services/submissions/cloudflare-verifier
        run: |
          npm test
          npx wrangler deploy --var "VERIFIER_RELEASE:${{ github.sha }}"

      - name: Deploy the stateful backend
        working-directory: services/submissions/cloudflare-backend
        run: |
          npx wrangler deploy --var "BACKEND_RELEASE:${{ github.sha }}"

      - name: Test and deploy the public Pages gateway
        working-directory: services/submissions/cloudflare-gateway
        run: |
          npm ci --ignore-scripts
          npm test
          npx wrangler pages deploy public \
            --project-name rlogs-submissions \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-message "Deploy rLogs Cloudflare production ${{ github.sha }}"

      - name: Verify the public service and deployed revision
        run: node tools/smoke-test-cloudflare-production.mjs https://rlogs-submissions.pages.dev "${{ github.sha }}"

      - name: Queue the bounded projection backfill request
        if: github.event_name == 'workflow_dispatch' && inputs.projection_backfill != 'none'
        working-directory: services/submissions/cloudflare-backend
        shell: bash
        env:
          BACKFILL_MODE: ${{ inputs.projection_backfill }}
          BACKFILL_LIMIT: ${{ inputs.projection_backfill_limit }}
          BACKFILL_AFTER: ${{ inputs.projection_backfill_after_report_id }}
          TARGET_RELEASE: ${{ github.sha }}
          BACKFILL_BATCH_ID: bf_${{ github.run_id }}_${{ github.run_attempt }}
          BACKFILL_REQUESTED_BY: ${{ github.actor }}
          BACKFILL_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$BACKFILL_LIMIT" =~ ^([1-9]|1[0-9]|2[0-5])$ ]] || { echo "Backfill limit must be 1-25" >&2; exit 1; }
          [[ -z "$BACKFILL_AFTER" || "$BACKFILL_AFTER" =~ ^rpt_[a-f0-9]{32}$ ]] || { echo "Invalid report cursor" >&2; exit 1; }
          [[ "$BACKFILL_MODE" == "dry-run" || "$BACKFILL_MODE" == "publish" ]] || exit 1
          [[ "$BACKFILL_REQUESTED_BY" =~ ^[A-Za-z0-9-]{1,64}$ ]] || exit 1
          DRY_RUN=0
          [[ "$BACKFILL_MODE" == "dry-run" ]] && DRY_RUN=1
          AFTER_SQL=NULL
          [[ -n "$BACKFILL_AFTER" ]] && AFTER_SQL="'$BACKFILL_AFTER'"
          SQL="INSERT INTO projection_backfill_batches (batch_id,requested_by,workflow_run_url,target_verifier_release,source_schema_version,target_schema_version,maximum_reports,dry_run,after_report_id,state,created_unix_millis,updated_unix_millis) VALUES ('$BACKFILL_BATCH_ID','$BACKFILL_REQUESTED_BY','$BACKFILL_WORKFLOW_URL','$TARGET_RELEASE',12,15,$BACKFILL_LIMIT,$DRY_RUN,$AFTER_SQL,'pending',CAST(unixepoch('now') AS INTEGER)*1000,CAST(unixepoch('now') AS INTEGER)*1000);"
          npx wrangler d1 execute rlogs-production --remote --command "$SQL"
          echo "Queued $BACKFILL_BATCH_ID for exact verifier release $TARGET_RELEASE ($BACKFILL_MODE, at most $BACKFILL_LIMIT reports)."
