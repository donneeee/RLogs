name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bpsr-map-compiler-requirements.txt

      - name: Build the local game-map compiler
        shell: pwsh
        run: |
          ./tools/windows/build-bpsr-map-compiler.ps1 `
            -OutputDirectory apps/desktop-tauri/resources/map-compiler

      - name: Install desktop UI dependencies
        working-directory: apps/desktop/ui
        run: npm ci --ignore-scripts

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches the desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match desktop version v$version"
          }

          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are required at $notesPath"
          }
          $notes = Get-Content -Raw -LiteralPath $notesPath
          $requiredPatterns = [ordered]@{
            title = "(?m)^# rLogs v$([regex]::Escape($version))\s*$"
            highlights = "(?m)^## Highlights\s*$"
            compatibility = "(?m)^## Compatibility\s*$"
            platform = "(?mi)^\s*-\s*Platform:\s*\S.+$"
            game_deployment = "(?mi)^\s*-\s*Game deployment:\s*\S.+$"
            game_builds = "(?mi)^\s*-\s*Game build\(s\):\s*\S.+$"
            public_report_schema = "(?mi)^\s*-\s*Public report schema:\s*\S.+$"
            capability_status = "(?m)^## Capability status\s*$"
            available_capabilities = "(?mi)^\s*-\s*Available:\s*\S.+$"
            locked_capabilities = "(?mi)^\s*-\s*Locked:\s*\S.+$"
            known_limitations = "(?m)^## Known limitations\s*$"
          }
          foreach ($requirement in $requiredPatterns.GetEnumerator()) {
            if ($notes -notmatch $requirement.Value) {
              throw "Release notes at $notesPath are missing required field '$($requirement.Key)'. Start from docs/releases/TEMPLATE.md."
            }
          }

      - name: Verify the tagged commit passed main CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = "${{ github.repository }}"
          $commit = "${{ github.sha }}"
          $defaultBranch = "${{ github.event.repository.default_branch }}"
          $runs = gh api "/repos/$repository/actions/workflows/ci.yml/runs?head_sha=$commit&status=success&per_page=100" | ConvertFrom-Json
          $passedMain = @($runs.workflow_runs | Where-Object {
            $_.event -eq "push" -and
            $_.head_branch -eq $defaultBranch -and
            $_.head_sha -eq $commit -and
            $_.conclusion -eq "success"
          })
          if ($passedMain.Count -eq 0) {
            throw "Commit $commit has no successful CI push run on $defaultBranch. Finish and verify the major feature on main before tagging it."
          }

      - name: Build and attach the Windows installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-tauri
          tagName: ${{ github.ref_name }}
          releaseName: rLogs v__VERSION__
          releaseBody: Installer validation is still running.
          releaseDraft: true
          prerelease: false
          args: --ci
          retryAttempts: 2

      - name: Smoke-test the packaged Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "rLogs_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The expected NSIS installer was not produced"
          }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $manifestPath = (Resolve-Path "apps/desktop-tauri/Cargo.toml").Path
          $desktopPackage = $metadata.packages | Where-Object {
            [System.IO.Path]::GetFullPath($_.manifest_path) -eq $manifestPath
          }
          if (-not $desktopPackage -or @($desktopPackage).Count -ne 1) {
            throw "Could not resolve the desktop application package from Cargo metadata"
          }
          $applicationName = "$($desktopPackage.name).exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP "rlogs-installer-smoke-$version"
          ./tools/windows/smoke-test-rlogs-installer.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedVersion $version `
            -ApplicationName $applicationName `
            -InstallDirectory $installDirectory

      - name: Record the checksum and publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content apps/desktop-tauri/tauri.conf.json | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "rLogs_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The expected NSIS installer was not produced"
          }
          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are required at $notesPath"
          }
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          $signingStatus = switch ($signature.Status) {
            "Valid" {
              $subject = $signature.SignerCertificate.Subject -replace "[\r\n]+", " "
              "Authenticode valid ($subject)"
            }
            "NotSigned" { "Not Authenticode signed" }
            default {
              throw "Installer Authenticode status is $($signature.Status): $($signature.StatusMessage)"
            }
          }
          $checksumsName = "rLogs_${version}_SHA256SUMS.txt"
          $checksumsPath = Join-Path $installer.DirectoryName $checksumsName
          "$sha256 *$($installer.Name)" | Set-Content -LiteralPath $checksumsPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumsPath --clobber
          $release = gh release view "${{ github.ref_name }}" --json assets | ConvertFrom-Json
          $installerAssets = @($release.assets | Where-Object { $_.name -match '^rLogs_(?:[0-9]+\.[0-9]+\.[0-9]+_)?x64-setup\.exe$' })
          if ($installerAssets.Count -ne 1 -or $installerAssets[0].name -ne $installer.Name) {
            throw "Release must contain exactly the validated versioned installer $($installer.Name)"
          }
          $notes = (Get-Content -Raw -LiteralPath $notesPath).Trim()
          $body = @(
            $notes
            ""
            "## Build provenance"
            ""
            ('- Source commit: `{0}`' -f "${{ github.sha }}")
            ('- Artifact: `{0}` (Windows x64, NSIS)' -f $installer.Name)
            ('- Installer SHA-256: `{0}`' -f $sha256)
            "- Signing status: $signingStatus"
            ('- Checksums: `{0}`' -f $checksumsName)
          ) -join [Environment]::NewLine
          gh release edit "${{ github.ref_name }}" --title "rLogs v$version" --notes $body --draft=false --latest
