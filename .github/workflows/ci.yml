name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-verifier-portability:
    name: WASM verifier portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check the portable submission and replay crates
        run: |
          cargo check -p rlogs-submission --target wasm32-unknown-unknown
          cargo check -p rlogs-game-bpsr --target wasm32-unknown-unknown
          cargo check -p rlogs-plugin-combat-meter --target wasm32-unknown-unknown
          cargo check -p rlogs-plugin-encounter-recorder --target wasm32-unknown-unknown

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            services/submissions/cloudflare-gateway/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bpsr-map-compiler-requirements.txt
      - name: Build and self-check the local game-map compiler
        shell: pwsh
        run: |
          ./tools/windows/build-bpsr-map-compiler.ps1 `
            -OutputDirectory apps/desktop-tauri/resources/map-compiler
      - name: Verify BPSR promotion frontier
        run: node tools/bpsr-promotion-frontier-audit.mjs verify
      - name: Verify BPSR Imagine role-action identities
        run: node tools/bpsr-auxiliary-action-identity-audit.mjs verify
      - name: Verify Blade Sweep inverse-defense proof
        run: |
          node tools/bpsr-blade-sweep-inverse-defense-proof.mjs self-test
          node tools/bpsr-blade-sweep-inverse-defense-proof.mjs verify --input plugins/games/blue-protocol-star-resonance/research/game-file-inventory/global/steam-24687926/blade-sweep-inverse-defense-proof.v1.json
      - name: Verify desktop release metadata
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/tauri.conf.json | ConvertFrom-Json).version
          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are required at $notesPath"
          }
          if ((Get-Item -LiteralPath $notesPath).Length -eq 0) {
            throw "Release notes at $notesPath are empty"
          }
      - name: Verify Windows installer smoke-test script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path "tools/windows/smoke-test-rlogs-installer.ps1").Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref] $tokens,
            [ref] $errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            throw "Windows installer smoke-test script has PowerShell syntax errors"
          }
          $scriptParameters = $ast.ParamBlock.Parameters.Name.VariablePath.UserPath
          foreach ($requiredParameter in @("InstallerPath", "ExpectedVersion", "ApplicationName", "InstallDirectory")) {
            if ($requiredParameter -notin $scriptParameters) {
              throw "Windows installer smoke-test script is missing required parameter $requiredParameter"
            }
          }
      - name: Build desktop UI
        working-directory: apps/desktop/ui
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Test Cloudflare submission gateway
        working-directory: services/submissions/cloudflare-gateway
        run: |
          npm ci --ignore-scripts
          npm test
          npx wrangler pages functions build functions --outdir "${{ runner.temp }}/rlogs-pages-functions" --build-output-directory public
      - name: Test Cloudflare submission backend
        working-directory: services/submissions/cloudflare-backend
        run: |
          npm ci --ignore-scripts
          npm test
          npx wrangler deploy --dry-run
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Pin the cache action to an immutable commit. This preserves the exact
      # format, Clippy, and workspace-test gates while avoiding cold dependency
      # rebuilds on every fresh Windows runner.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
