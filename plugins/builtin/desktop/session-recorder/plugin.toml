schema_version = 1
id = "app.rlogs.session-recorder"
name = "Session Recorder"
version = "0.1.0"
api_version = 1
runtime = "browser_overlay"
entrypoint = "ui/runtime.html"
capabilities = ["ui_workspace_publish"]
subscriptions = []
allowed_network_domains = []

[workspace]
default_order = -100

[[workspace.tabs]]
id = "control"
label = "Control"
entrypoint = "ui/control.html"
section = "recorder"

[[workspace.tabs]]
id = "sessions"
label = "Last Session"
entrypoint = "ui/sessions.html"
section = "recorder"

[[workspace.tabs]]
id = "events"
label = "Event Viewer"
entrypoint = "ui/events.html"
section = "recorder"

[[workspace.tabs]]
id = "runs"
label = "Run Report"
entrypoint = "ui/runs.html"
section = "recorder"
